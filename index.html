<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistance Colour Code Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-layout">

        <div class="container">
            <h1>Resistance Calculator</h1>
            <p class="subtitle">Select resistor bands to calculate resistance </p>

            <div class="row">
                <label>First Band:</label>
                <select id="band1">
                    <option value=""> Select </option>
                    <option value="black"> Black </option>
                    <option value="brown"> Brown </option>
                    <option value="red"> Red </option>
                    <option value="orange"> Orange </option>
                    <option value="yellow"> Yellow </option>
                    <option value="green"> Green </option>
                    <option value="blue"> Blue </option>
                    <option value="violet"> Violet </option>
                    <option value="grey"> Grey </option>
                    <option value="white"> White </option>
                </select>
                <div id="preview1" class="preview"></div>
            </div>

            <div class="row">
                <label>Second Band:</label>
                <select id="band2">
                    <option value=""> Select </option>
                    <option value="black"> Black </option>
                    <option value="brown"> Brown </option>
                    <option value="red"> Red </option>
                    <option value="orange"> Orange </option>
                    <option value="yellow"> Yellow </option>
                    <option value="green"> Green </option>
                    <option value="blue"> Blue </option>
                    <option value="violet"> Violet </option>
                    <option value="grey"> Grey </option>
                    <option value="white"> White </option>
                </select>
                <div id="preview2" class="preview"></div>
            </div>

            <div class="row">
                <label>Multiplier:</label>
                <select id="multiplier">
                    <option value=""> Select </option>
                    <option value="black"> Black </option>
                    <option value="brown"> Brown </option>
                    <option value="red"> Red </option>
                    <option value="orange"> Orange </option>
                    <option value="yellow"> Yellow </option>
                    <option value="green"> Green </option>
                    <option value="blue"> Blue </option>
                    <option value="violet"> Violet </option>
                    <option value="grey"> Grey </option>
                    <option value="white"> White </option>
                    <option value="gold"> Gold </option>
                    <option value="silver"> Silver </option>
                </select>
                <div id="preview3" class="preview"></div>
            </div>

            <div class="row">
                <label>Tolerance:</label>
                <select id="tolerance">
                    <option value=""> Select </option>
                    <option value="silver"> Silver </option>
                    <option value="gold"> Gold </option>
                    <option value="none"> No Colour </option>
                </select>
                <div id="preview4" class="preview"></div>
            </div>

            <h2 id="result">Resistance: —</h2>
        </div>

        <div class="side-image">
            <img src="chart.png" alt="Resistor Chart">
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
